<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Chủ nghĩa xã hội khoa học</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <h1>Ôn Tập Chủ Nghĩa Xã Hội Khoa Học</h1>

        <!-- Màn hình chọn chế độ/chương -->
        <div id="selection-screen">
            <h3>Chọn chế độ học:</h3>
            <div class="chapter-list">
                <button onclick="startChapter(1)">Chương 1: Nhập môn CNXHKH</button>
                <button onclick="startChapter(2)">Chương 2: Sứ mệnh lịch sử của giai cấp công nhân</button>
                <button onclick="startChapter(3)">Chương 3: CNXH và Thời kỳ quá độ lên CNXH</button>
                <button onclick="startChapter(4)">Chương 4: Dân chủ XHCN và Nhà nước XHCN</button>
                <button onclick="startChapter(5)">Chương 5: Cơ cấu xã hội - giai cấp & liên minh</button>
                <button onclick="startChapter(6)">Chương 6: Vấn đề dân tộc và tôn giáo</button>
                <button onclick="startChapter(7)">Chương 7: Vấn đề gia đình</button>
            </div>
            <hr>
            <button class="random-btn" onclick="startRandom60()">🎲 Trộn ngẫu nhiên 60 câu (Từ 7 Chương)</button>
        </div>

        <!-- Màn hình làm bài -->
        <div id="quiz-screen" class="hidden">
            <button id="btn-back" onclick="backToList()">← Quay lại danh sách</button>
            <div id="question" class="question"></div>
            <div id="options" class="options-container"></div>
            <div class="footer">
                <span id="progress">Câu 1/10</span>
                <button id="next-btn" onclick="nextQuestion()">Câu tiếp theo</button>
            </div>
        </div>

        <!-- Màn hình kết quả -->
        <div id="result-screen" class="hidden">
            <h2>Hoàn thành bài trắc nghiệm!</h2>
            <p id="score">Điểm của bạn: 0</p>
            <button onclick="backToMenu()">Về màn hình chính</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="answers.js"></script>
    <script src="script.js"></script>
</body>
</html>
